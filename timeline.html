<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ProntVita - Linha do Tempo</title>

    <link rel="stylesheet" href="estilo.css">
    <script src="cadastro.js" defer></script>
    <script src="pacientes.js" defer></script>

</head>


<body class="pagina-inicio">


    <!-- CABEÇALHO -->

    <header class="cabecalho-sistema">

        <div class="logo-sistema">

            <span class="logo-pront">
                Pront
            </span>

            <span class="logo-vita">
                Vita
            </span>

        </div>


        <div class="usuario">

            <span class="nome-usuario">
                Usuário
            </span>

            <div class="foto-usuario">
                <span>👤</span>
            </div>

        </div>

    </header>



    <!-- ESTRUTURA -->

    <div class="estrutura-sistema">


        <!-- MENU LATERAL -->

        <aside class="menu-lateral">

            <a
                href="principal.html"
                class="menu-item"
            >
                Início
            </a>


            <a
                href="pacientes.html"
                class="menu-item"
            >
                Pacientes
            </a>


            <a
                href="historico.html"
                class="menu-item"
            >
                Auditoria
            </a>


            <a
                href="timeline.html"
                class="menu-item ativo"
            >
                Linha do Tempo
            </a>


            <a
                href="#"
                class="menu-item"
                onclick="sairSistema()"
            >
                Sair
            </a>

        </aside>



        <!-- CONTEÚDO -->

        <main class="conteudo-linha-tempo">


            <section class="area-linha-tempo">


                <!-- PESQUISA -->

                <div class="barra-pesquisa-linha-tempo">

                    <input
                        type="text"
                        placeholder="Nome, código, telefone ou CPF..."
                    >

                    <div class="icone-pesquisa"></div>

                </div>



                <!-- TÍTULO -->

                <div class="titulo-linha-tempo">

                    <h1>
                        Linha do Tempo dos Pacientes
                    </h1>

                </div>



                <!-- LINHA DO TEMPO -->

                <div class="lista-linha-tempo">


                    <!-- CABEÇALHO -->

                    <div class="cabecalho-tabela-tempo">

                        <span>
                            Nome
                        </span>

                        <span>
                            Telefone
                        </span>

                        <span>
                            Código
                        </span>

                        <span>
                            CPF
                        </span>

                        <span>
                            Linha do Tempo
                        </span>

                    </div>



                    <!-- ESTADO VAZIO -->

                    <div class="linha-tempo-vazia">

                        Nenhum paciente cadastrado.

                    </div>


                </div>


            </section>


        </main>


    </div>


</body>

</html>
